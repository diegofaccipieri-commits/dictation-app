name: DictationApp
options:
  bundleIdPrefix: com.diego
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    majorVersion: 0.9.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    majorVersion: 2.0.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    majorVersion: 0.12.4

targets:
  DictationApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - DictationApp
      - path: DictationApp/whisper-cli
        type: file
        buildPhase: resources
      - path: DictationApp/whisper-server
        type: file
        buildPhase: resources
    info:
      path: DictationApp/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "DictationApp needs microphone access to record your voice."
        NSSpeechRecognitionUsageDescription: "DictationApp uses speech recognition to detect the wake word Sileide."
        NSScreenCaptureUsageDescription: "O DictationApp precisa da permissao de Gravacao de Tela para capturar o audio do sistema nas reunioes (Zoom, Teams, Meet, navegador)."
        NSAudioCaptureUsageDescription: "O DictationApp precisa gravar o audio do sistema para capturar o que os outros participantes falam nas reunioes."
        CFBundleShortVersionString: "1.31.4"
        CFBundleVersion: "13104"
        NSHumanReadableCopyright: ""
    dependencies:
      - package: WhisperKit
      - package: KeyboardShortcuts
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diego.dictationapp
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
